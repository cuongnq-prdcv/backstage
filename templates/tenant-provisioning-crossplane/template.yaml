apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: tenant-provisioning-crossplane-template
  title: Tenant Provisioning (Crossplane)
  description: >-
    Tenant-provisioning template (Crossplane): collects the inputs needed to
    provision or update a tenant's TenantEnvironment manifest (tenant name,
    environment, and optional components) and opens a pull request against the
    Crossplane live repository.
spec:
  owner: user:guest
  type: service

  # The input form: collects the values the tenant:provision-crossplane action
  # maps to the TenantEnvironment spec (tenant, environment, and one
  # spec.<component>.enabled per selected component).
  parameters:
    - title: Tenant provisioning inputs
      required:
        - tenantName
        - environment
      properties:
        tenantName:
          title: Tenant name
          type: string
          description: >-
            Identifier for the tenant (e.g. acme). Used as the tenant's
            manifest name/namespace prefix and written to the spec.tenant field.
            Must be lowercase RFC1123: start/end alphanumeric, 3-22 chars,
            hyphens allowed in the middle.
          pattern: '^[a-z0-9]([a-z0-9-]{1,20})[a-z0-9]$'
          ui:autofocus: true
        environment:
          title: Environment
          type: string
          description: >-
            Deployment environment for this tenant configuration. Used as the
            manifest name/namespace suffix and written to the spec.environment
            field. Must be one of dev, staging, prod.
          enum:
            - dev
            - staging
            - prod
          default: dev
        components:
          title: Components
          description: Optional components to enable for this tenant/environment.
          type: array
          items:
            type: string
            enum:
              - table
              - repository
          uniqueItems: true
          default: []
          ui:widget: checkboxes

  # Invoke the tenant:provision-crossplane scaffolder action, which
  # renders/updates the tenant's TenantEnvironment manifest in the Crossplane
  # live repo on a new branch and opens a pull request. The workflow ends at the
  # pull request — no crossplane/kubectl apply or cluster/cloud side effects.
  steps:
    - id: provision
      name: Provision tenant TenantEnvironment manifest
      action: tenant:provision-crossplane
      input:
        tenantName: ${{ parameters.tenantName }}
        environment: ${{ parameters.environment }}
        selectedComponents: ${{ parameters.components }}

  # Render the branch name and pull request URL on the results screen.
  output:
    links:
      - title: Open pull request
        url: ${{ steps.provision.output.pullRequestUrl }}
    text:
      - title: Provisioning result
        content: |
          - **Tenant name:** ${{ parameters.tenantName }}
          - **Environment:** ${{ parameters.environment }}
          - **Components:** ${{ parameters.components }}
          - **Branch:** ${{ steps.provision.output.branchName }}
          - **Pull request:** ${{ steps.provision.output.pullRequestUrl }}

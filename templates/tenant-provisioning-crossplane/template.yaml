apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: tenant-provisioning-crossplane-template
  title: Tenant Provisioning (Crossplane)
  description: >-
    Tenant-provisioning template (Crossplane): collects the inputs needed to
    provision or update a tenant's XTenantEnvironment XR manifest (tenant name,
    environment, Azure location, and storage account SKU) and opens a pull
    request against the Crossplane live repository.
spec:
  owner: user:guest
  type: service

  # The input form: collects the values the tenant:render-crossplane-manifest
  # action maps to the XTenantEnvironment XR spec (tenantName, environment,
  # location, storageAccountSkuName; compositionRef.name comes from config). The
  # components selector is retained but commented out (disabled).
  parameters:
    - title: Tenant provisioning inputs
      required:
        - tenantName
        - environment
      properties:
        tenantName:
          title: Tenant name
          type: string
          description: >-
            Identifier for the tenant (e.g. acme). Used as the tenant's
            manifest metadata name prefix and written to the spec.tenantName
            field. Must be lowercase RFC1123: start/end alphanumeric, 3-22 chars,
            hyphens allowed in the middle.
          pattern: '^[a-z0-9]([a-z0-9-]{1,20})[a-z0-9]$'
          ui:autofocus: true
        environment:
          title: Environment
          type: string
          description: >-
            Deployment environment for this tenant configuration. Used as the
            manifest metadata name suffix and written to the spec.environment
            field. Must be one of dev, staging, prod.
          enum:
            - dev
            - staging
            - prod
          default: dev
        location:
          title: Location
          type: string
          description: >-
            Azure region written to the spec.location field. Defaults to
            japaneast.
          enum:
            - japaneast
            - japanwest
            - southeastasia
          default: japaneast
        storageAccountSkuName:
          title: Storage account SKU
          type: string
          description: >-
            Azure Storage account SKU written to the spec.storageAccountSkuName
            field. Defaults to Standard_LRS.
          enum:
            - Standard_LRS
            - Standard_GRS
            - Standard_RAGRS
            - Standard_ZRS
            - Premium_LRS
          default: Standard_LRS
        # DISABLED — retained for re-enable. The components selector rendered one
        # spec.<component>.enabled block per selection. Uncomment to restore it
        # (and uncomment the emit loop in manifest.ts + the step input below).
        # components:
        #   title: Components
        #   description: Optional components to enable for this tenant/environment.
        #   type: array
        #   items:
        #     type: string
        #     enum:
        #       - table
        #       - repository
        #   uniqueItems: true
        #   default: []
        #   ui:widget: checkboxes

  # Two steps: the custom action owns the domain logic (validate, read config,
  # render the manifest into the task workspace) and emits every value the
  # built-in pull-request action needs; the built-in action does the branch,
  # commit, and pull request through the GitHub API. The workflow ends at the
  # pull request — no crossplane/kubectl apply or cluster/cloud side effects.
  #
  # Step ids are camelCase: the Backstage docs warn that a dashed step id breaks
  # ${{ steps.my-step.output.x }} expressions.
  steps:
    - id: renderManifest
      name: Render tenant XTenantEnvironment manifest
      action: tenant:render-crossplane-manifest
      input:
        tenantName: ${{ parameters.tenantName }}
        environment: ${{ parameters.environment }}
        location: ${{ parameters.location }}
        storageAccountSkuName: ${{ parameters.storageAccountSkuName }}
        # DISABLED — retained for re-enable (uncomment with the components param):
        # selectedComponents: ${{ parameters.components }}

    # repoUrl, branchName, and targetBranchName all come from the previous step
    # so that the live repo URL and base branch stay in app-config
    # (${CROSSPLANE_LIVE_REPO_URL}) instead of being hardcoded here.
    #
    # update: true pairs with the deterministic branch name
    # devops/<tenant>-<environment>: re-provisioning a tenant/environment updates
    # the existing open pull request instead of opening a duplicate.
    - id: createPullRequest
      name: Open pull request against the Crossplane live repo
      action: publish:github:pull-request
      input:
        repoUrl: ${{ steps.renderManifest.output.repoUrl }}
        branchName: ${{ steps.renderManifest.output.branchName }}
        targetBranchName: ${{ steps.renderManifest.output.targetBranchName }}
        sourcePath: ${{ steps.renderManifest.output.sourcePath }}
        targetPath: ${{ steps.renderManifest.output.targetPath }}
        title: ${{ steps.renderManifest.output.title }}
        description: ${{ steps.renderManifest.output.description }}
        commitMessage: ${{ steps.renderManifest.output.commitMessage }}
        update: true

  # Render the pull request link and the change summary on the results screen.
  output:
    links:
      - title: Open pull request
        url: ${{ steps.createPullRequest.output.remoteUrl }}
    text:
      - title: Provisioning result
        content: |
          - **Tenant name:** ${{ parameters.tenantName }}
          - **Environment:** ${{ parameters.environment }}
          - **Location:** ${{ parameters.location }}
          - **Storage account SKU:** ${{ parameters.storageAccountSkuName }}
          - **Manifest:** ${{ steps.renderManifest.output.manifestPath }}
          - **Branch:** ${{ steps.renderManifest.output.branchName }}
          - **Pull request:** ${{ steps.createPullRequest.output.remoteUrl }}
